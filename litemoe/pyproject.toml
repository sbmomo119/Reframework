[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litemoe"
version = "0.1.0"
description = "Lite MoE expert-offload runtime: GGUF/safetensors loading, int4 quant, LRU/PDE expert cache"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "gguf>=0.10",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
litemoe = "litemoe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
